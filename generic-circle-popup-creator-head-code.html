<style>
  :root {
    --ink: #142033;
    --muted: #536174;
    --line: #c8d5e6;
    --panel: #ffffff;
    --soft: #f4f7fb;
    --code: #101827;
    --blue: #1f6feb;
    --blue-soft: #eef4ff;
    --green: #1c7c54;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--soft);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
  }

  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 22px 72px;
  }

  header {
    margin-bottom: 28px;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(34px, 5vw, 56px);
    line-height: 1;
    letter-spacing: 0;
  }

  h2 {
    margin: 0 0 14px;
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: 0;
  }

  h3 {
    margin: 0 0 8px;
    font-size: 18px;
    line-height: 1.25;
    letter-spacing: 0;
  }

  p {
    margin: 0 0 14px;
    color: var(--muted);
  }

  .lede {
    max-width: 840px;
    font-size: 19px;
  }

  .section {
    margin-top: 26px;
    padding: 28px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }

  .step {
    min-height: 100px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fbfdff;
  }

  .step-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .step-heading h3 {
    margin: 0;
  }

  .step-number {
    display: inline-flex;
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: var(--blue);
    color: #fff;
    font-weight: 800;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }

  th,
  td {
    padding: 13px 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
    text-align: left;
    font-size: 14px;
  }

  th {
    background: var(--blue-soft);
    color: var(--ink);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  code,
  pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }

  :not(pre) > code {
    color: #172033;
    font-size: 0.95em;
  }

  .code-card {
    overflow: hidden;
    margin-top: 16px;
    border: 1px solid #1f2c44;
    border-radius: 8px;
    background: var(--code);
  }

  .code-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #25314a;
    color: #a7b3c4;
    font-size: 14px;
  }

  .copy-button {
    min-height: 36px;
    border: 1px solid #3d8bfd;
    border-radius: 8px;
    padding: 8px 12px;
    background: var(--blue);
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
  }

  .copy-button:focus {
    outline: 3px solid rgba(31, 111, 235, 0.28);
    outline-offset: 2px;
  }

  pre {
    max-height: 520px;
    margin: 0;
    overflow: auto;
    padding: 18px;
    color: #d8e1f0;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre;
  }

  .code-card pre {
    display: block !important;
    max-height: 520px !important;
    margin: 0 !important;
    overflow: auto !important;
    padding: 18px !important;
    background: var(--code) !important;
    color: #d8e1f0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    font-size: 13px !important;
    line-height: 1.55 !important;
    white-space: pre !important;
  }

  .code-card pre code,
  .code-card #generated-code {
    display: inline !important;
    background: transparent !important;
    color: #d8e1f0 !important;
    border: 0 !important;
    padding: 0 !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace !important;
    font-size: inherit !important;
    line-height: inherit !important;
    white-space: pre !important;
  }

  .note {
    border-left: 4px solid var(--green);
    padding: 14px 16px;
    background: #effaf4;
    color: #234736;
  }

  .checklist {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 18px;
    margin: 0;
    padding-left: 20px;
    color: var(--muted);
  }

  .state-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .state-card {
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fbfdff;
  }

  .generator-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    gap: 16px;
    margin-top: 18px;
  }

  .generator-workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(360px, 0.86fr);
    align-items: start;
    gap: 24px;
    margin-top: 18px;
  }

  .generator-config-panel {
    min-width: 0;
  }

  .generator-workspace .generator-form {
    grid-template-columns: 1fr;
    margin-top: 0;
  }

  .field {
    display: grid;
    align-content: start;
    gap: 7px;
  }

  .field.is-disabled {
    opacity: 0.56;
  }

  .field.is-disabled input {
    background: #f8fafc;
    cursor: not-allowed;
  }

  .field--wide {
    grid-column: 1 / -1;
  }

  label {
    color: var(--ink);
    font-size: 14px;
    font-weight: 800;
  }

  .radio-field {
    display: grid;
    gap: 9px;
    margin: 0;
    border: 0;
    padding: 0;
  }

  .radio-field legend {
    margin: 0;
    padding: 0;
    color: var(--ink);
    font-size: 14px;
    font-weight: 800;
  }

  .radio-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
  }

  .radio-option {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 28px;
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }

  .radio-option input[type="radio"] {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    min-height: 16px;
    margin: 0;
    padding: 0;
    accent-color: var(--blue);
  }

  input,
  textarea,
  select {
    box-sizing: border-box;
    width: 100%;
    height: 44px;
    min-height: 44px;
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
  }

  .url-prefix-field {
    display: flex;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }

  .url-prefix {
    display: inline-flex;
    align-items: center;
    border-right: 1px solid var(--line);
    padding: 0 12px;
    background: #f8fafc;
    color: var(--muted);
    font: inherit;
    font-size: 15px;
    white-space: nowrap;
  }

  .url-prefix-field input {
    min-width: 0;
    border: 0;
    border-radius: 0;
  }

  .url-prefix-field:focus-within {
    border-color: var(--blue);
    outline: 3px solid rgba(31, 111, 235, 0.16);
    outline-offset: 1px;
  }

  .url-prefix-field:focus-within input {
    outline: 0;
  }

  textarea {
    height: auto;
    min-height: 96px;
    resize: vertical;
  }

  select {
    line-height: 1.2;
  }

  input:focus,
  textarea:focus,
  select:focus {
    border-color: var(--blue);
    outline: 3px solid rgba(31, 111, 235, 0.16);
    outline-offset: 1px;
  }

  .radio-option input[type="radio"]:focus {
    outline: 3px solid rgba(31, 111, 235, 0.16);
    outline-offset: 2px;
  }

  .field-help {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .field-help-list {
    padding-left: 18px;
  }

  .field-help-list li + li {
    margin-top: 2px;
  }

  .form-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }

  .secondary-button {
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
  }

  .validation-list {
    display: none;
    margin: 14px 0 0;
    padding: 12px 14px 12px 34px;
    border: 1px solid #f2b8b5;
    border-radius: 8px;
    background: #fff5f5;
    color: #8a1f17;
  }

  .validation-list.is-visible {
    display: block;
  }

  .popup-preview-wrap {
    position: sticky;
    top: 20px;
    margin-top: 0;
  }

  .popup-preview-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 360px;
    margin-top: 14px;
    padding: 22px;
    border: 1px solid #d7dfec;
    border-radius: 8px;
    background: linear-gradient(rgba(15, 23, 42, 0.48), rgba(15, 23, 42, 0.48)), #f7f9fc;
  }

  .popup-preview-card {
    position: relative;
    width: min(100%, 440px);
    border-radius: 14px;
    background: #fff;
    color: #111827;
    box-shadow: 0 24px 80px rgba(15, 23, 42, 0.22);
    padding: 26px;
  }

  .popup-preview-close {
    position: absolute;
    top: 12px;
    right: 12px;
    display: inline-flex;
    width: 34px;
    height: 34px;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #6b7280;
    cursor: default;
    font: inherit;
    font-size: 24px;
    line-height: 1;
  }

  .popup-preview-close:hover {
    background: #f3f4f6;
    color: #111827;
  }

  .popup-preview-card.is-image-before-title .popup-preview-close {
    background: rgba(17, 24, 39, 0.62);
    color: #fff;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18);
  }

  .popup-preview-card.is-image-before-title .popup-preview-close:hover {
    background: rgba(17, 24, 39, 0.78);
    color: #fff;
  }

  .popup-preview-image {
    display: none;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 18px;
  }

  .popup-preview-card h2 {
    margin: 0 32px 8px 0;
    color: #111827;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.2;
  }

  .popup-preview-card h2 + .popup-preview-image {
    margin-top: 16px;
  }

  .popup-preview-subtext {
    margin: 0 0 24px;
  }

  .popup-preview-subtext p {
    margin: 0 0 12px;
    color: #4b5563;
    font-size: 15px;
    line-height: 1.5;
  }

  .popup-preview-subtext p:last-child {
    margin-bottom: 0;
  }

  .popup-preview-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .popup-preview-primary,
  .popup-preview-secondary {
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: default;
    font: inherit;
    font-size: 14px;
    white-space: nowrap;
  }

  .popup-preview-primary {
    background: #0637f1;
    color: #fff;
    font-weight: 600;
  }

  .popup-preview-secondary {
    background: #eef1ff;
    color: #24305f;
    font-weight: 500;
  }

  @media (max-width: 860px) {
    .grid,
    .state-grid,
    .generator-workspace,
    .generator-form,
    .checklist {
      grid-template-columns: 1fr;
    }

    .field--wide {
      grid-column: auto;
    }

    .section {
      padding: 20px;
    }

    th,
    td {
      display: block;
      width: 100%;
    }

    th {
      display: none;
    }

    td {
      border-bottom: 0;
    }

    tr {
      display: block;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
    }

    tr:last-child {
      border-bottom: 0;
    }

    .popup-preview-stage {
      min-height: 320px;
      padding: 16px;
    }

    .popup-preview-wrap {
      position: static;
    }

    .popup-preview-card {
      padding: 22px;
    }

    .popup-preview-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .popup-preview-primary,
    .popup-preview-secondary {
      width: 100%;
      padding-left: 10px;
      padding-right: 10px;
    }
  }
</style>

: POPUP.title,\n        page_path: window.location.pathname,\n        page_url: window.location.href,\n        root_domain: POPUP.rootDomain\n      }, extraProperties || {});\n    }\n\n    function waitForMixpanel(callback, timeoutMs) {\n      const startedAt = Date.now();\n\n      (function check() {\n        const tracker = getMixpanelTracker();\n\n        if (tracker) {\n          callback(tracker);\n          return;\n        }\n\n        if (Date.now() - startedAt >= timeoutMs) return;\n        setTimeout(check, 100);\n      })();\n    }\n\n    function trackPopupEvent(eventName, extraProperties) {\n      waitForMixpanel(function (tracker) {\n        tracker.track(eventName, getTrackingProperties(extraProperties));\n      }, 5000);\n    }\n\n    function trackThenRedirect(eventName, properties, url) {\n      var didRedirect = false;\n      var startedAt = Date.now();\n\n      function redirect() {\n        if (didRedirect) return;\n        didRedirect = true;\n        window.location.href = url;\n      }\n\n      (function checkAndTrack() {\n        const tracker = getMixpanelTracker();\n\n        if (tracker) {\n          tracker.track(eventName, getTrackingProperties(properties), redirect);\n          setTimeout(redirect, 350);\n          return;\n        }\n\n        if (Date.now() - startedAt >= 1500) {\n          redirect();\n          return;\n        }\n\n        setTimeout(checkAndTrack, 100);\n      })();\n    }\n\n\n    function closePopup() {\n      document.getElementById(\"circle-popup\")?.remove();\n    }\n\n    function declinePopup(method) {\n      saveState({\n        dismissed: true,\n        dismissedAt: Date.now()\n      });\n\n      trackPopupEvent(\"Community Popup Declined\", {\n        decline_method: method\n      });\n\n      closePopup();\n    }\n\n    function remindLaterPopup(method) {\n      saveState({\n        remindUntil: Date.now() + POPUP.remindDays * 24 * 60 * 60 * 1000,\n        remindedAt: Date.now()\n      });\n\n      trackPopupEvent(\"Community Popup Remind Later Clicked\", {\n        remind_days: POPUP.remindDays,\n        remind_method: method\n      });\n\n      closePopup();\n    }\n\n    function shouldShowPopup() {\n      const saved = getSavedState();\n      const now = Date.now();\n\n      if (!isTargetPage()) return false;\n      if (saved.completed === true || saved.dismissed === true) return false;\n      if (saved.remindUntil && now < saved.remindUntil) return false;\n      if (document.getElementById(\"circle-popup\")) return false;\n\n      return true;\n    }\n\n    function getImageMarkup(position) {\n      if (!POPUP.imageUrl || POPUP.imagePlacement !== position) return \"\";\n\n      return `\n      <img\n        id=\"circle-popup-image\"\n        src=\"${POPUP.imageUrl}\"\n        alt=\"\"\n      />\n    `;\n    }\n\n    function showPopup() {\n      if (!shouldShowPopup()) return;\n\n      const style = document.createElement(\"style\");\n      style.id = \"circle-popup-style\";\n      style.textContent = `\n      #circle-popup {\n        position: fixed;\n        inset: 0;\n        z-index: 999999;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        padding: 20px;\n        background: rgba(15, 23, 42, 0.48);\n        font-family: inherit;\n      }\n\n      #circle-popup-card {\n        position: relative;\n        width: min(100%, 440px);\n        background: #fff;\n        color: #111827;\n        border-radius: 14px;\n        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.22);\n        padding: 26px;\n      }\n\n      #circle-popup-close {\n        position: absolute;\n        top: 12px;\n        right: 12px;\n        display: inline-flex;\n        width: 34px;\n        height: 34px;\n        align-items: center;\n        justify-content: center;\n        border: 0;\n        border-radius: 999px;\n        background: transparent;\n        color: #6b7280;\n        font-size: 24px;\n        line-height: 1;\n        cursor: pointer;\n        font-family: inherit;\n      }\n\n      #circle-popup-close:hover {\n        background: #f3f4f6;\n        color: #111827;\n      }\n\n      #circle-popup-card.circle-popup-card--image-before-title #circle-popup-close {\n        background: rgba(17, 24, 39, 0.62);\n        color: #fff;\n        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18);\n      }\n\n      #circle-popup-card.circle-popup-card--image-before-title #circle-popup-close:hover {\n        background: rgba(17, 24, 39, 0.78);\n        color: #fff;\n      }\n\n      #circle-popup-image {\n        display: block;\n        width: 100%;\n        max-height: 220px;\n        object-fit: cover;\n        border-radius: 10px;\n        margin-bottom: 18px;\n      }\n\n      #circle-popup h2 {\n        margin: 0 32px 8px 0;\n        font-size: 24px;\n        line-height: 1.2;\n        font-weight: 700;\n      }\n\n      #circle-popup h2 + #circle-popup-image {\n        margin-top: 16px;\n      }\n\n      #circle-popup-subtext {\n        margin: 0 0 24px;\n      }\n\n      #circle-popup-subtext p {\n        margin: 0 0 12px;\n        font-size: 15px;\n        line-height: 1.5;\n        color: #4b5563;\n      }\n\n      #circle-popup-subtext p:last-child {\n        margin-bottom: 0;\n      }\n\n      #circle-popup-actions {\n        display: flex;\n        align-items: center;\n        gap: 10px;\n      }\n\n      #circle-popup-primary,\n      #circle-popup-secondary {\n        border: 0;\n        border-radius: 8px;\n        padding: 11px 16px;\n        font-size: 14px;\n        cursor: pointer;\n        font-family: inherit;\n        white-space: nowrap;\n      }\n\n      #circle-popup-primary {\n        background: #0637F1;\n        color: #fff;\n        font-weight: 600;\n      }\n\n      #circle-popup-secondary {\n        background: #eef1ff;\n        color: #24305f;\n        font-weight: 500;\n      }\n\n\n      @media (max-width: 480px) {\n        #circle-popup-card {\n          padding: 22px;\n        }\n\n        #circle-popup-actions {\n          display: grid;\n          grid-template-columns: 1fr 1fr;\n          column-gap: 10px;\n          row-gap: 16px;\n          align-items: center;\n        }\n\n        #circle-popup-primary,\n        #circle-popup-secondary {\n          width: 100%;\n          padding-left: 10px;\n          padding-right: 10px;\n        }\n\n      }\n    `;\n\n      if (!document.getElementById(\"circle-popup-style\")) {\n        document.head.appendChild(style);\n      }\n\n      const popup = document.createElement(\"div\");\n      popup.id = \"circle-popup\";\n      popup.innerHTML = `\n      <div id=\"circle-popup-card\" role=\"dialog\" aria-modal=\"true\" ${getDialogLabelAttrs()}>\n        <button id=\"circle-popup-close\" type=\"button\" aria-label=\"Close popup\">&times;</button>\n        ${getImageMarkup(\"before-title\")}\n        ${getTitleMarkup()}\n        ${getImageMarkup(\"after-title\")}\n        ${getSubtextMarkup()}\n        <div id=\"circle-popup-actions\">\n          <button id=\"circle-popup-primary\" type=\"button\">${escapeHtml(POPUP.ctaText)}</button>\n          <button id=\"circle-popup-secondary\" type=\"button\">Remind me later</button>\n        </div>\n      </div>\n    `;\n\n      if (POPUP.imageUrl && POPUP.imagePlacement === \"before-title\") {\n        popup.querySelector(\"#circle-popup-card\").classList.add(\"circle-popup-card--image-before-title\");\n      }\n\n      document.body.appendChild(popup);\n\n      trackPopupEvent(\"Community Popup Viewed\");\n\n      document.getElementById(\"circle-popup-close\").addEventListener(\"click\", function () {\n        declinePopup(\"x_button\");\n      });\n\n      document.getElementById(\"circle-popup-primary\").addEventListener(\"click\", function () {\n        saveState({\n          completed: true,\n          completedAt: Date.now()\n        });\n\n        trackThenRedirect(\"Community Popup CTA Clicked\", {\n          cta_text: POPUP.ctaText,\n          cta_url: POPUP.ctaUrl\n        }, POPUP.ctaUrl);\n      });\n\n      document.getElementById(\"circle-popup-secondary\").addEventListener(\"click\", function () {\n        remindLaterPopup(\"button\");\n      });\n\n\n      popup.addEventListener(\"click\", function (event) {\n        if (event.target === popup) remindLaterPopup(\"outside_click\");\n      });\n    }\n\n    function watchForCircleNavigation() {\n      const originalPushState = history.pushState;\n      const originalReplaceState = history.replaceState;\n\n      history.pushState = function () {\n        originalPushState.apply(this, arguments);\n        setTimeout(showPopup, 250);\n      };\n\n      history.replaceState = function () {\n        originalReplaceState.apply(this, arguments);\n        setTimeout(showPopup, 250);\n      };\n\n      window.addEventListener(\"popstate\", function () {\n        setTimeout(showPopup, 250);\n      });\n    }\n\n    if (document.readyState === \"loading\") {\n      document.addEventListener(\"DOMContentLoaded\", showPopup);\n    } else {\n      showPopup();\n    }\n\n    watchForCircleNavigation();\n  })();\n<\/script>";
    var DEFAULT_GENERATOR_VALUES = {
      rootDomain: "your-community.example.com",
      targetMode: "specific-paths",
      targetPaths: "/feed",
      showTitle: "true",
      title: "Your popup title",
      subtext: "Write the popup message here. Explain what people will get when they click the button.",
      imageUrl: "",
      imagePlacement: "before-title",
      ctaText: "Open link",
      ctaUrl: "https://example.com",
      storageKey: "circle-popup-your-campaign-v1",
      trackingName: "your-campaign-name",
      remindDays: "7"
    };

    function copyTextToClipboard(text, button) {
      function markCopied() {
        if (!button) return;
        var original = button.textContent;
        button.textContent = "Copied";
        setTimeout(function () {
          button.textContent = original;
        }, 1600);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied);
        return;
      }

      var textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
      markCopied();
    }

    function normalizeGeneratedDomain(value) {
      var raw = String(value || "").trim();
      if (!raw) return "";

      try {
        return new URL(raw.indexOf("http") === 0 ? raw : "https://" + raw).hostname;
      } catch (error) {
        return raw.replace(/^https?:\/\//, "").replace(/\/.*$/, "");
      }
    }

    function readGeneratorValues() {
      var form = document.getElementById("popup-generator-form");
      var data = new FormData(form);

      return {
        rootDomain: normalizeGeneratedDomain(data.get("rootDomain")),
        targetMode: String(data.get("targetMode") || "specific-paths").trim(),
        targetPaths: String(data.get("targetPaths") || "").split(",").map(function (path) {
          return path.trim();
        }).filter(Boolean),
        showTitle: String(data.get("showTitle") || "true") === "true",
        title: String(data.get("title") || "").trim(),
        subtext: String(data.get("subtext") || "").trim(),
        imageUrl: String(data.get("imageUrl") || "").trim(),
        imagePlacement: String(data.get("imagePlacement") || "before-title").trim(),
        ctaText: String(data.get("ctaText") || "").trim(),
        ctaUrl: String(data.get("ctaUrl") || "").trim(),
        storageKey: String(data.get("storageKey") || "").trim(),
        trackingName: String(data.get("trackingName") || "").trim(),
        remindDays: Math.max(1, parseInt(data.get("remindDays"), 10) || 7)
      };
    }

    function normalizeGeneratedPath(path) {
      if (!path) return "";
      return path.charAt(0) === "/" ? path : "/" + path;
    }

    function validateGeneratorValues(values) {
      var warnings = [];

      if (!values.rootDomain) warnings.push("Community domain is required.");
      if (values.targetMode === "specific-paths" && !values.targetPaths.length) warnings.push("At least one target path is required when using specific paths.");
      if (values.showTitle && !values.title) warnings.push("Popup title is required when Show headline is enabled.");
      if (!values.ctaText) warnings.push("CTA button text is required.");
      if (!values.ctaUrl || values.ctaUrl.indexOf("https://") !== 0) warnings.push("CTA URL should be a full https:// URL.");
      if (values.imageUrl && values.imageUrl.indexOf("https://") !== 0) warnings.push("Image URL should be blank or a full https:// URL.");
      if (!values.storageKey) warnings.push("Storage key is required.");
      if (!values.trackingName) warnings.push("Tracking name is required.");

      return warnings;
    }

    function showGeneratorWarnings(warnings) {
      var list = document.getElementById("generator-warnings");
      if (!list) return;
      list.innerHTML = "";
      warnings.forEach(function (warning) {
        var item = document.createElement("li");
        item.textContent = warning;
        list.appendChild(item);
      });
      list.classList.toggle("is-visible", warnings.length > 0);
    }

    function buildGeneratedConfig(values) {
      var paths = values.targetPaths.map(normalizeGeneratedPath);
      var pathLines = paths.map(function (path) {
        return "        " + JSON.stringify(path);
      }).join(",\n");

      return [
        "    const POPUP = {",
        "      rootDomain: " + JSON.stringify(values.rootDomain) + ",",
        "      targetMode: " + JSON.stringify(values.targetMode) + ", // Options: \"specific-paths\" or \"all-pages\"",
        "      targetPaths: [",
        pathLines,
        "      ],",
        "      excludedPathPrefixes: [",
        "        \"/settings\",",
        "        \"/messages\"",
        "      ],",
        "      showTitle: " + values.showTitle + ",",
        "      title: " + JSON.stringify(values.title) + ",",
        "      subtext: " + JSON.stringify(values.subtext) + ",",
        "      imageUrl: " + JSON.stringify(values.imageUrl) + ",",
        "      imagePlacement: " + JSON.stringify(values.imagePlacement) + ", // Options: \"before-title\" or \"after-title\"",
        "      ctaText: " + JSON.stringify(values.ctaText) + ",",
        "      ctaUrl: " + JSON.stringify(values.ctaUrl) + ",",
        "      storageKey: " + JSON.stringify(values.storageKey) + ",",
        "      trackingName: " + JSON.stringify(values.trackingName) + ",",
        "      remindDays: " + values.remindDays,
        "    };"
      ].join("\n");
    }

    function escapePreviewHtml(value) {
      return String(value || "").replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function applyPreviewBasicMarkdown(value) {
      return escapePreviewHtml(value)
        .replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+?)\*/g, "<em>$1</em>");
    }

    function formatPreviewLineBreaks(value) {
      return escapePreviewHtml(value).replace(/\r\n/g, "\n").replace(/\n/g, "<br>");
    }

    function formatPreviewParagraphs(value) {
      var normalized = String(value || "").replace(/\r\n/g, "\n").trim();
      if (!normalized) return "";

      return normalized.split(/\n{2,}/).map(function (paragraph) {
        return "<p>" + applyPreviewBasicMarkdown(paragraph).replace(/\n/g, "<br>") + "</p>";
      }).join("");
    }

    function updatePopupPreview(values) {
      var titleElement = document.getElementById("popup-preview-title");
      var subtextElement = document.getElementById("popup-preview-subtext");
      var primaryElement = document.getElementById("popup-preview-primary");

      if (titleElement) {
        titleElement.innerHTML = formatPreviewLineBreaks(values.title || "Your popup title");
        titleElement.style.display = values.showTitle ? "" : "none";
      }

      if (subtextElement) subtextElement.innerHTML = formatPreviewParagraphs(values.subtext || "Write the popup message here.");
      if (primaryElement) primaryElement.textContent = values.ctaText || "Open link";

      var previewCard = document.querySelector(".popup-preview-card");
      var beforeImage = document.getElementById("popup-preview-image-before");
      var afterImage = document.getElementById("popup-preview-image-after");
      var images = [beforeImage, afterImage];

      if (previewCard) {
        previewCard.classList.toggle("is-image-before-title", Boolean(values.imageUrl && values.imagePlacement === "before-title"));
      }

      images.forEach(function (image) {
        if (!image) return;
        image.removeAttribute("src");
        image.style.display = "none";
      });

      if (!values.imageUrl) return;

      var activeImage = values.imagePlacement === "after-title" ? afterImage : beforeImage;
      if (!activeImage) return;

      activeImage.src = values.imageUrl;
      activeImage.style.display = "block";
    }

    function updateTargetPathAvailability(values) {
      var targetPathsField = document.getElementById("target-paths-field");
      var targetPathsInput = document.getElementById("targetPaths");
      var disabled = values.targetMode === "all-pages";

      if (targetPathsField) targetPathsField.classList.toggle("is-disabled", disabled);
      if (targetPathsInput) targetPathsInput.readOnly = disabled;
    }

    function buildGeneratedBlock() {
      var values = readGeneratorValues();
      var warnings = validateGeneratorValues(values);
      var generatedConfig = buildGeneratedConfig(values);
      var generatedBlock = POPUP_TEMPLATE.replace(/    const POPUP = \{[\s\S]*?\n    \};/, generatedConfig);

      showGeneratorWarnings(warnings);
      updateTargetPathAvailability(values);
      updatePopupPreview(values);
      var generatedCode = document.getElementById("generated-code");
      if (generatedCode) generatedCode.textContent = generatedBlock;

      return {
        config: generatedConfig.replace(/^    /gm, ""),
        block: generatedBlock,
        warnings: warnings
      };
    }

    function resetGenerator() {
      Object.keys(DEFAULT_GENERATOR_VALUES).forEach(function (key) {
        var field = document.getElementById(key);
        var radio = document.querySelector('input[type="radio"][name="' + key + '"][value="' + DEFAULT_GENERATOR_VALUES[key] + '"]');

        if (radio) {
          radio.checked = true;
        } else if (field) {
          field.value = DEFAULT_GENERATOR_VALUES[key];
        }
      });
      buildGeneratedBlock();
    }

    var generatorForm = document.getElementById("popup-generator-form");
    var generatedCode = document.getElementById("generated-code");
    var copyGeneratedBlockButton = document.getElementById("copy-generated-block");
    var resetGeneratorButton = document.getElementById("reset-generator");

    if (!generatorForm || !generatedCode) return false;
    if (generatorForm.dataset.popupGeneratorReady === "true") {
      buildGeneratedBlock();
      return true;
    }

    generatorForm.dataset.popupGeneratorReady = "true";
    generatorForm.addEventListener("input", buildGeneratedBlock);
    generatorForm.addEventListener("change", buildGeneratedBlock);

    if (copyGeneratedBlockButton) {
      copyGeneratedBlockButton.addEventListener("click", function (event) {
        copyTextToClipboard(buildGeneratedBlock().block, event.currentTarget);
      });
    }

    if (resetGeneratorButton) {
      resetGeneratorButton.addEventListener("click", resetGenerator);
    }

    document.querySelectorAll("[data-copy-target]").forEach(function (button) {
      button.addEventListener("click", function () {
        var target = document.getElementById(button.getAttribute("data-copy-target"));
        var text = target ? target.textContent : "";
        copyTextToClipboard(text, button);
      });
    });

    buildGeneratedBlock();
    return true;
    }

    function tryInitCirclePopupReadmeGenerator() {
      initAttempts += 1;

      if (initCirclePopupReadmeGenerator()) return;
      if (initAttempts >= maxInitAttempts) return;

      setTimeout(tryInitCirclePopupReadmeGenerator, 250);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", tryInitCirclePopupReadmeGenerator);
    } else {
      tryInitCirclePopupReadmeGenerator();
    }
  })();
</script>
